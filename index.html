<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Medical Store</title>
<meta name="description" content="Medical Store — non-stop music, no ads." />

<!--
  =====================================================================
  MEDICAL STORE — background music jukebox
  ---------------------------------------------------------------------
  v3 changes from v2:
    - Header restructured into two rows:
        row 1 (above the dashed line) = live clock (left) · online
              count (true center, via grid) · playlist link (right)
        row 2 (below the dashed line) = "medical store · dawakhana
              radio" tagline, centered
    - Center brand title changed to Hindi "मेडिकल स्टोर" and moved
      higher up the page.
    - Bottom capsule player:
        - taller + more internal spacing so prev/play/next/mute
          buttons don't overlap each other on mobile taps
        - added a mute/unmute (speaker) button
        - moved further up from the bottom edge

  FILE MAP (search for these markers to edit fast):
    1. CONFIG        -> playlist id, brand name, background image
    2. FONTS         -> Google Fonts import
    3. CSS VARIABLES -> color / spacing tokens, edit palette here
    4. CSS           -> layout + component styles
    5. HTML          -> page markup
    6. JS - CONFIG   -> same config values, used by the script
    7. JS - YOUTUBE  -> loads YouTube IFrame API, plays the playlist
    8. JS - UI LOGIC -> play/pause, mute, next/prev, progress, clock
  =====================================================================
-->

<!-- ============ 2. FONTS ============
     Fraunces = warm serif for the big brand title (display face)
     Noto Serif Devanagari = matching serif for the Hindi title
     JetBrains Mono = "prescription label" utility face for small text -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Noto+Serif+Devanagari:wght@500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<style>

  /* ================= 3. CSS VARIABLES — EDIT PALETTE HERE ================= */
  :root{
    /* --- CONFIG: swap this to change the background photo --- */
    --bg-image: url('images/background.webp');

    /* colors */
    --ink-deep:    #06231F;   /* near-black teal, used only in small doses */
    --cream:       #FFFFFF;   /* pure white — used for ALL header/main text now */
    --muted:       #FFFFFF;   /* was a dim teal-white; now same pure white so
                                  time / online count / tagline read clearly */
    --accent-red:  #E14B3D;   /* "medical cross" red — play button, tag */
    --accent-mint: #79E6C4;   /* pulse-line green — ECG, active states  */
    --line:        rgba(246,243,233,0.22); /* hairline dividers */

    /* capsule (bottom player pill) */
    --capsule-bg:  rgba(6,35,31,0.55);     /* translucent so photo still shows through */
    --capsule-blur: 14px;

    /* type */
    --font-display: 'Fraunces', Georgia, serif;
    --font-hindi: 'Noto Serif Devanagari', 'Fraunces', serif;
    --font-mono: 'JetBrains Mono', ui-monospace, monospace;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html,body{
    height:100%;
    font-family: var(--font-mono);
    color: var(--cream);
    -webkit-font-smoothing: antialiased;
  }

  body{
    min-height:100dvh;
    position:relative;
    overflow-x:hidden;

    /* background photo, only a soft vignette top/bottom for legibility */
    background-image:
      linear-gradient(180deg, rgba(6,35,31,0.40) 0%, rgba(6,35,31,0.05) 22%, rgba(6,35,31,0.05) 70%, rgba(6,35,31,0.55) 100%),
      var(--bg-image);
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
  }

  /* ================= HEADER BAR ================= */
  .topbar{
    position:fixed;
    top:0; left:0; right:0;
    z-index:5;
  }

  /* row 1: clock | online count (true center) | playlist link
     3-column grid so the center item stays centered regardless of
     how wide the left/right items are */
  .topbar-row1{
    display:grid;
    grid-template-columns: 1fr auto 1fr;
    align-items:center;
    padding: 18px 28px 14px;
    font-size: 16px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .live-clock{
    justify-self:start;
    color: var(--muted);
    text-shadow: 0 1px 6px rgba(0,0,0,0.6);
    font-variant-numeric: tabular-nums; /* keeps digits from jittering in width */
  }

  .online-count{
    justify-self:center;
    display:flex;
    align-items:center;
    color: var(--muted);
    text-shadow: 0 1px 6px rgba(0,0,0,0.6);
  }
  .online-count b{ color: var(--cream); font-weight:700; margin-left:4px; }

  /* pulse/heartbeat dot next to the "online" count */
  .pulse-dot{
    display:inline-block;
    width:8px; height:8px;
    border-radius:50%;
    background: var(--accent-mint);
    box-shadow: 0 0 0 0 rgba(121,230,196,0.6);
    animation: pulse 1.6s ease-out infinite;
    margin-right:8px;
  }
  @keyframes pulse{
    0%   { box-shadow: 0 0 0 0 rgba(121,230,196,0.55); }
    70%  { box-shadow: 0 0 0 10px rgba(121,230,196,0); }
    100% { box-shadow: 0 0 0 0 rgba(121,230,196,0); }
  }

  .topbar-row1 .yt-link{
    justify-self:end;
    display:flex;
    align-items:center;
    color: var(--cream);
    opacity:0.9;
    transition: opacity .15s ease, transform .15s ease;
    filter: drop-shadow(0 1px 6px rgba(0,0,0,0.6));
  }
  .topbar-row1 .yt-link:hover{ opacity:1; transform: scale(1.08); color: var(--accent-mint); }

  /* row 2: tagline, sits BELOW the dashed line */
  .topbar-row2{
    text-align:center;
    padding: 6px 16px 14px;
    font-family: var(--font-mono);
    font-style: normal;
    font-weight:700;
    font-size: 20px;
    letter-spacing: 0.28em;          /* wide tracking = prescription-label feel */
    text-transform: uppercase;
    text-decoration: underline;
    text-decoration-style: dashed;   /* dashed instead of solid = matches the
                                         perforation / ECG motif elsewhere */
    text-decoration-color: var(--accent-mint);
    text-decoration-thickness: 2px;
    text-underline-offset: 6px;
    color: var(--cream);
    text-shadow: 0 1px 6px rgba(0,0,0,0.6);
  }

  /* ================= CENTER CONTENT (brand only, page kept quiet) ================= */
  .center{
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;  /* pinned toward the top instead of true center */
    text-align:center;
    padding: 170px 24px 220px; /* top padding now clears the fixed 2-row header
                                   (clock/online/icon row + tagline row) with room
                                   to spare, so the title never overlaps it;
                                   bottom padding keeps it clear of the capsule */
  }

  .brand{
    font-family: var(--font-hindi);
    font-weight:600;
    font-size: clamp(112px, 24vw, 176px);
    letter-spacing: 0.01em;
    line-height:1.05;
    color: var(--cream);
    text-shadow: 0 4px 24px rgba(0,0,0,0.55); /* keeps title readable over any photo */
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 0.25em;
    flex-wrap:wrap;
  }

  /* small "Rx" stamp badge under the title */
  .stamp{
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding: 7px 16px;
    border: 1px solid var(--accent-red);
    border-radius: 999px;
    background: rgba(225,75,61,0.55);   /* light dull-red fill so the box itself
                                            stands out against the red-toned photo */
    color: var(--cream);                /* white text, now clearly readable */
    font-size: 14px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  /* ================= 4b. BOTTOM CAPSULE PLAYER ================= */
  .capsule-wrap{
    position:fixed;
    left:0; right:0;
    bottom: 46px;                 /* moved further up from the bottom edge */
    z-index:5;
    display:flex;
    flex-direction:column;        /* stamp stacks above the capsule */
    align-items:center;
    gap: 12px;                    /* the "gap" between stamp and capsule */
    padding: 0 16px;
  }

  .capsule{
    display:flex;
    align-items:center;
    gap:16px;
    max-width: 520px;
    width:100%;
    min-height: 76px;             /* taller capsule = more room between buttons */
    padding: 12px 20px 12px 12px;
    border-radius: 999px;
    background: var(--capsule-bg);
    backdrop-filter: blur(var(--capsule-blur));
    -webkit-backdrop-filter: blur(var(--capsule-blur));
    border: 1px solid var(--line);
    box-shadow: 0 20px 50px rgba(0,0,0,0.45);
  }

  .capsule-art{
    width: 54px;
    height: 54px;
    border-radius: 999px;         /* round thumbnail = capsule/tablet feel */
    overflow:hidden;
    flex-shrink:0;
    background: var(--ink-deep);
    border: 1px solid var(--line);
  }
  .capsule-art img{
    width:100%; height:100%;
    object-fit:cover;
    display:block;
  }

  .capsule-info{
    flex:1;
    min-width:0; /* required so text-overflow ellipsis works in a flex child */
    display:flex;
    flex-direction:column;
    gap: 4px;
  }
  .capsule-title{
    font-family: var(--font-display);
    font-size: 17px;
    font-weight:600;
    color: var(--cream);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .capsule-artist{
    font-size: 13px;
    color: var(--muted);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  /* thin ECG-style progress line under the title/artist text */
  .capsule-progress-track{
    position:relative;
    height:3px;
    margin-top:5px;
    background: var(--line);
    border-radius: 3px;
    cursor:pointer;
    overflow:hidden;
  }
  .capsule-progress-fill{
    position:absolute;
    top:0; left:0; bottom:0;
    width:0%;                /* JS updates this */
    background: var(--accent-mint);
    border-radius: 3px;
  }

  /* buttons: prev / play / next / mute, with generous gap + padding so
     mobile taps land on one button at a time, never two at once */
  .capsule-controls{
    display:flex;
    align-items:center;
    gap: 4px;
    flex-shrink:0;
  }

  .btn-icon{
    background:none;
    border:none;
    color: var(--cream);
    cursor:pointer;
    opacity:0.8;
    padding:12px;              /* bigger touch target */
    display:flex;
    align-items:center;
    justify-content:center;
    transition: opacity .15s ease, transform .15s ease;
  }
  .btn-icon:hover{ opacity:1; transform: scale(1.1); }
  .btn-icon svg{ width:17px; height:17px; }

  /* pill-shaped play button, like a capsule tablet, inside the bigger capsule */
  .btn-play{
    width: 40px;
    height: 40px;
    border-radius: 999px;
    background: var(--cream);         /* white pill instead of red */
    border:none;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    box-shadow: 0 6px 16px rgba(0,0,0,0.35);
    transition: transform .15s ease;
  }
  .btn-play:hover{ transform: scale(1.08); }
  .btn-play svg{ width:16px; height:16px; fill: var(--accent-red); } /* red icon so it's visible on white */

  /* small screens: tighten spacing but keep touch targets comfortable */
  @media (max-width:480px){
    .topbar-row1{ padding: 14px 16px 10px; font-size:13px; }
    .topbar-row2{ font-size:12px; }
    .capsule-wrap{ bottom: 34px; padding: 0 12px; }
    .capsule{ gap:10px; padding: 10px 14px 10px 10px; min-height:68px; }
    .capsule-art{ width:46px; height:46px; }
    .capsule-title{ font-size:15px; }
    .capsule-artist{ font-size:12px; }
    .btn-icon{ padding:10px; }
    .brand{ font-size: clamp(70px, 21vw, 120px); }
    .center{ padding: 150px 18px 200px; }
  }
</style>
</head>
<body>

  <!-- ================= 5. HTML ================= -->

  <!-- HEADER row 1: live clock (left) · online count (center) · playlist link (right) -->
  <header class="topbar">
    <div class="topbar-row1">
      <span class="live-clock" id="liveClock">--:--:--</span>

      <span class="online-count">
        <span class="pulse-dot"></span>
        <span id="onlineCount">128</span><span>&nbsp;online</span>
      </span>

      <a href="https://youtube.com/playlist?list=PLq-bT4s33RYADNkcClDkLPovaKJx0HTDM" target="_blank" rel="noopener" class="yt-link" aria-label="Open full playlist on YouTube Music">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor">
          <circle cx="12" cy="12" r="10"/>
          <circle cx="12" cy="12" r="6.3" fill="#06231F"/>
          <circle cx="12" cy="12" r="2.2" fill="currentColor"/>
          <path d="M10.5 9.2v5.6l4.8-2.8z" fill="#06231F"/>
        </svg>
      </a>
    </div>

    <!-- HEADER row 2: tagline, sits below the dashed divider -->
    <div class="topbar-row2">Dawakhana Radio &middot; 24x7</div>
  </header>

  <!-- CENTER: Hindi brand title, pinned higher on the page -->
  <main class="center">
    <h1 class="brand">मेडिकल स्टोर</h1>
  </main>

  <!-- BOTTOM: "Rx · now playing" stamp sits above the capsule with a gap,
       then the floating capsule player (thumbnail, title/artist, controls) -->
  <div class="capsule-wrap">
    <div class="stamp">Rx &middot; now playing</div>

    <div class="capsule">
      <div class="capsule-art">
        <img id="albumArt" src="" alt="Now playing artwork" />
      </div>

      <div class="capsule-info">
        <span class="capsule-title" id="songTitle">Loading playlist…</span>
        <span class="capsule-artist" id="songArtist">Medical Store Radio</span>
        <div class="capsule-progress-track" id="progressTrack">
          <div class="capsule-progress-fill" id="progressFill"></div>
        </div>
      </div>

      <div class="capsule-controls">
        <button class="btn-icon" id="prevBtn" aria-label="Previous song">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>

        <button class="btn-play" id="playBtn" aria-label="Play or pause">
          <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </button>

        <button class="btn-icon" id="nextBtn" aria-label="Next song">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 6l8.5 6L6 18z"/></svg>
        </button>

        <button class="btn-icon" id="muteBtn" aria-label="Mute or unmute">
          <svg id="muteIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M3 10v4h4l5 5V5L7 10H3zm13.5 2c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Hidden YouTube player: only audio is used, no video chrome/ads shown -->
  <div id="ytPlayer" style="position:absolute; width:1px; height:1px; overflow:hidden; opacity:0;"></div>

<script>
  /* ================= 6. JS - CONFIG =================
     Change these two values to point the page at a different
     playlist or brand name. Everything else adapts automatically. */
  const CONFIG = {
    PLAYLIST_ID: 'PLq-bT4s33RYADNkcClDkLPovaKJx0HTDM', // your YouTube playlist
    BRAND_NAME: 'Medical Store'
  };

  /* ================= 7. JS - YOUTUBE PLAYER SETUP ================= */

  // Load the YouTube IFrame API script asynchronously.
  const ytScript = document.createElement('script');
  ytScript.src = 'https://www.youtube.com/iframe_api';
  document.body.appendChild(ytScript);

  let player;               // the YT.Player instance
  let isPlaying = false;
  let progressTimer = null; // interval used to update the progress bar

  // Called automatically by the YouTube API once it has loaded.
  window.onYouTubeIframeAPIReady = function () {
    player = new YT.Player('ytPlayer', {
      height: '1',
      width: '1',
      playerVars: {
        listType: 'playlist',
        list: CONFIG.PLAYLIST_ID,
        autoplay: 1,
        controls: 0,     // hide YouTube's own UI, we use our own controls
        disablekb: 1,
        modestbranding: 1,
        rel: 0
      },
      events: {
        onReady: onPlayerReady,
        onStateChange: onPlayerStateChange
      }
    });
  };

  function onPlayerReady() {
    // Some browsers block autoplay with sound until the user interacts once.
    player.playVideo();
  }

  function onPlayerStateChange(event) {
    if (event.data === YT.PlayerState.PLAYING) {
      isPlaying = true;
      setPlayIcon(true);
      updateNowPlayingInfo();
      startProgressTimer();
    } else if (event.data === YT.PlayerState.PAUSED) {
      isPlaying = false;
      setPlayIcon(false);
      stopProgressTimer();
    } else if (event.data === YT.PlayerState.ENDED) {
      // playlist auto-advances on its own; this is just a safety net
      stopProgressTimer();
    } else if (event.data === YT.PlayerState.CUED) {
      updateNowPlayingInfo();
    }
  }

  /* ================= 8. JS - UI LOGIC ================= */

  function setPlayIcon(playing) {
    const icon = document.getElementById('playIcon');
    icon.innerHTML = playing
      ? '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>'   // pause icon
      : '<path d="M8 5v14l11-7z"/>';                // play icon
  }

  // swap the speaker icon between "sound on" and "muted" states
  function setMuteIcon(muted) {
    const icon = document.getElementById('muteIcon');
    icon.innerHTML = muted
      // muted speaker (speaker + slash)
      ? '<path d="M16.5 12A4.5 4.5 0 0 0 14 8v1.5l2.24 2.24c.16-.55.26-1.13.26-1.74zM19 12c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3 3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06a8.99 8.99 0 0 0 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4 9.91 6.09 12 8.18V4z"/>'
      // normal speaker
      : '<path d="M3 10v4h4l5 5V5L7 10H3zm13.5 2c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>';
  }

  function updateNowPlayingInfo() {
    if (!player || typeof player.getVideoData !== 'function') return;
    const data = player.getVideoData();
    if (!data) return;

    document.getElementById('songTitle').textContent = data.title || 'Medical Store Radio';
    document.getElementById('songArtist').textContent = data.author || CONFIG.BRAND_NAME;

    if (data.video_id) {
      // hqdefault thumbnail = reliable size that exists for every YouTube video
      document.getElementById('albumArt').src =
        `https://img.youtube.com/vi/${data.video_id}/hqdefault.jpg`;
    }
  }

  function startProgressTimer() {
    stopProgressTimer();
    progressTimer = setInterval(() => {
      if (!player || typeof player.getCurrentTime !== 'function') return;
      const current = player.getCurrentTime();
      const duration = player.getDuration();
      const pct = duration ? (current / duration) * 100 : 0;
      document.getElementById('progressFill').style.width = pct + '%';
    }, 500);
  }

  function stopProgressTimer() {
    if (progressTimer) clearInterval(progressTimer);
    progressTimer = null;
  }

  // ---- transport button handlers ----
  document.getElementById('playBtn').addEventListener('click', () => {
    if (!player) return;
    isPlaying ? player.pauseVideo() : player.playVideo();
  });

  document.getElementById('nextBtn').addEventListener('click', () => {
    if (player) player.nextVideo();
  });

  document.getElementById('prevBtn').addEventListener('click', () => {
    if (player) player.previousVideo();
  });

  // ---- mute/unmute button ----
  document.getElementById('muteBtn').addEventListener('click', () => {
    if (!player || typeof player.isMuted !== 'function') return;
    if (player.isMuted()) {
      player.unMute();
      setMuteIcon(false);
    } else {
      player.mute();
      setMuteIcon(true);
    }
  });

  // click-to-seek on the capsule's thin progress bar
  document.getElementById('progressTrack').addEventListener('click', (e) => {
    if (!player || typeof player.getDuration !== 'function') return;
    const rect = e.currentTarget.getBoundingClientRect();
    const ratio = (e.clientX - rect.left) / rect.width;
    const duration = player.getDuration();
    player.seekTo(duration * ratio, true);
  });

  // ---- live clock (top-left, updates every second) ----
  (function liveClock() {
    const el = document.getElementById('liveClock');
    function tick() {
      const now = new Date();
      let hours = now.getHours();
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12;
      if (hours === 0) hours = 12; // 0 -> 12 for 12-hour display
      el.textContent = `${hours}:${minutes} ${ampm}`;
    }
    tick();
    setInterval(tick, 1000);
  })();

  // ---- fake "online now" counter ----
  // Purely cosmetic (matches the reference site's vibe). Wander gently
  // around a base number every few seconds. Replace with a real
  // websocket/analytics feed if you want a genuine live count.
  (function fakeOnlineCounter() {
    const el = document.getElementById('onlineCount');
    let count = 128;
    setInterval(() => {
      count += Math.floor(Math.random() * 5) - 2; // drift by -2..+2
      count = Math.max(40, Math.min(400, count));
      el.textContent = count;
    }, 4000);
  })();
</script>
</body>
</html>

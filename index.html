<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Medical Store</title>
<meta name="description" content="Medical Store — non-stop music, no ads." />

<!--
  =====================================================================
  MEDICAL STORE — background music jukebox
  ---------------------------------------------------------------------
  Inspired by saloon.wtf's layout (big title, album art, minimal
  transport controls), reskinned around a "medical store / prescription
  pad" idea instead of a barber shop:
    - the progress bar looks like an ECG / pulse line
    - the online counter has a small heartbeat dot
    - the card has a torn "perforation" edge like a prescription slip
    - an "Rx" stamp sits near the title

  HOW THIS FILE IS ORGANISED (search for these markers to edit fast):
    1. CONFIG        -> change playlist id, brand name, background image
    2. FONTS         -> Google Fonts import
    3. CSS VARIABLES -> color / spacing tokens, edit palette here
    4. CSS           -> layout + component styles
    5. HTML          -> page markup
    6. JS - CONFIG   -> same config values, used by the script
    7. JS - YOUTUBE  -> loads YouTube IFrame API, plays the playlist
    8. JS - UI LOGIC -> play/pause, next/prev, progress bar, online count
  =====================================================================
-->

<!-- ============ 2. FONTS ============
     Fraunces = warm serif for the big brand title (display face)
     JetBrains Mono = "prescription label" utility face for small text -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<style>

  /* ================= 3. CSS VARIABLES — EDIT PALETTE HERE ================= */
  :root{
    /* --- CONFIG: swap this to change the background photo --- */
    --bg-image: url('https://raw.githubusercontent.com/nitesh230github/medical-store-playlist/main/images/background.png');

    /* colors */
    --ink-deep:    #06231F;   /* near-black teal, base overlay color   */
    --ink-mid:     #0F3B35;   /* mid teal, used in gradient overlay    */
    --cream:       #F6F3E9;   /* prescription-pad paper color, main text */
    --muted:       #A9C2BC;   /* secondary text / labels                */
    --accent-red:  #E14B3D;   /* "medical cross" red — play button, tag */
    --accent-mint: #79E6C4;   /* pulse-line green — ECG, active states  */
    --line:        rgba(246,243,233,0.18); /* hairline dividers */

    /* type */
    --font-display: 'Fraunces', Georgia, serif;
    --font-mono: 'JetBrains Mono', ui-monospace, monospace;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html,body{
    height:100%;
    font-family: var(--font-mono);
    color: var(--cream);
    -webkit-font-smoothing: antialiased;
  }

  body{
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 24px;
    overflow-x:hidden;

    /* ---- background photo + dark clinical-teal wash so text stays readable ---- */
    background-image:
      linear-gradient(180deg, rgba(6,35,31,0.88) 0%, rgba(6,35,31,0.75) 45%, rgba(6,35,31,0.92) 100%),
      var(--bg-image);
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
  }

  /* ================= HEADER BAR ================= */
  .topbar{
    position:fixed;
    top:0; left:0; right:0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 18px 28px;
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    border-bottom: 1px dashed var(--line);
    background: linear-gradient(180deg, rgba(6,35,31,0.55), transparent);
    backdrop-filter: blur(2px);
  }

  /* pulse/heartbeat dot next to the "online" count */
  .pulse-dot{
    display:inline-block;
    width:8px; height:8px;
    border-radius:50%;
    background: var(--accent-mint);
    box-shadow: 0 0 0 0 rgba(121,230,196,0.6);
    animation: pulse 1.6s ease-out infinite;
    margin-right:8px;
  }
  @keyframes pulse{
    0%   { box-shadow: 0 0 0 0 rgba(121,230,196,0.55); }
    70%  { box-shadow: 0 0 0 10px rgba(121,230,196,0); }
    100% { box-shadow: 0 0 0 0 rgba(121,230,196,0); }
  }

  .online-count{ display:flex; align-items:center; color: var(--muted); }
  .online-count b{ color: var(--cream); font-weight:700; margin-left:4px; }

  .rx-tag{
    color: var(--muted);
  }

  .topbar a{
    color: var(--cream);
    text-decoration:none;
    border-bottom: 1px solid var(--accent-red);
    padding-bottom: 2px;
  }
  .topbar a:hover{ color: var(--accent-mint); border-color: var(--accent-mint); }

  /* ================= MAIN CARD (prescription slip) ================= */
  .card{
    width:100%;
    max-width: 460px;
    text-align:center;
    padding: 40px 30px 34px;
    position:relative;
  }

  /* torn / perforated top edge, like tearing a prescription pad page */
  .perforation{
    display:flex;
    justify-content:center;
    gap:6px;
    margin-bottom: 28px;
    opacity:0.5;
  }
  .perforation span{
    width:4px; height:4px;
    border-radius:50%;
    background: var(--muted);
  }

  .brand{
    font-family: var(--font-display);
    font-weight:600;
    font-size: clamp(38px, 8vw, 58px);
    letter-spacing: 0.01em;
    line-height:1;
    color: var(--cream);
  }

  .tagline{
    margin-top:10px;
    font-size:12px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color: var(--muted);
  }

  /* small "Rx" stamp badge under the tagline */
  .stamp{
    display:inline-flex;
    align-items:center;
    gap:6px;
    margin-top:18px;
    padding: 4px 10px;
    border: 1px solid var(--accent-red);
    border-radius: 999px;
    color: var(--accent-red);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  /* ================= ALBUM ART ================= */
  .art-wrap{
    margin: 30px auto 22px;
    width: 220px;
    height: 220px;
    border-radius: 24px;                 /* soft "capsule" corner, not a sharp square */
    overflow:hidden;
    border: 1px solid var(--line);
    box-shadow: 0 20px 60px rgba(0,0,0,0.45);
    background: var(--ink-mid);
  }
  .art-wrap img{
    width:100%; height:100%;
    object-fit:cover;
    display:block;
  }

  .song-title{
    font-family: var(--font-display);
    font-size: 20px;
    font-weight:500;
    color: var(--cream);
    max-width: 380px;
    margin: 0 auto;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .song-artist{
    margin-top:6px;
    font-size:12px;
    color: var(--muted);
    letter-spacing:0.04em;
  }

  /* ================= PROGRESS / ECG LINE ================= */
  .progress-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin: 26px 0 8px;
    font-size:11px;
    color: var(--muted);
  }
  .progress-track{
    flex:1;
    position:relative;
    height:16px;
    cursor:pointer;
  }
  /* the base flat line of the "ECG" */
  .progress-track::before{
    content:"";
    position:absolute;
    top:50%; left:0; right:0;
    height:1px;
    background: var(--line);
    transform: translateY(-50%);
  }
  .progress-fill{
    position:absolute;
    top:0; left:0; bottom:0;
    width:0%;                      /* JS updates this */
    overflow:hidden;
  }
  .progress-fill::after{
    /* animated mint line standing in for the "played" ECG segment */
    content:"";
    position:absolute;
    top:50%; left:0; right:0;
    height:2px;
    background: var(--accent-mint);
    transform: translateY(-50%);
  }
  .progress-dot{
    position:absolute;
    top:50%; left:0%;
    width:9px; height:9px;
    border-radius:50%;
    background: var(--accent-mint);
    transform: translate(-50%,-50%);
    box-shadow: 0 0 8px rgba(121,230,196,0.8);
  }

  /* ================= TRANSPORT CONTROLS ================= */
  .controls{
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 22px;
    margin-top: 18px;
  }
  .btn-icon{
    background:none;
    border:none;
    color: var(--cream);
    cursor:pointer;
    opacity:0.75;
    padding:8px;
    transition: opacity .15s ease, transform .15s ease;
  }
  .btn-icon:hover{ opacity:1; transform: scale(1.08); }
  .btn-icon svg{ width:20px; height:20px; }

  /* pill-shaped play button, like a capsule tablet */
  .btn-play{
    width: 64px;
    height: 40px;
    border-radius: 999px;
    background: var(--accent-red);
    border:none;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    box-shadow: 0 10px 24px rgba(225,75,61,0.35);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .btn-play:hover{ transform: scale(1.05); }
  .btn-play svg{ width:18px; height:18px; fill: var(--cream); }

  .status-line{
    margin-top: 22px;
    font-size:10px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color: var(--muted);
  }

  /* small screens */
  @media (max-width:480px){
    .topbar{ padding: 14px 16px; font-size:11px; }
    .art-wrap{ width:180px; height:180px; }
  }
</style>
</head>
<body>

  <!-- ================= 5. HTML ================= -->

  <!-- HEADER: fake "online" listener count + link out to the playlist -->
  <header class="topbar">
    <div class="online-count">
      <span class="pulse-dot"></span>
      <span id="onlineCount">128</span><span>&nbsp;online</span>
    </div>
    <div class="rx-tag">medical store &middot; dawakhana radio</div>
    <a href="https://youtube.com/playlist?list=PLq-bT4s33RYADNkcClDkLPovaKJx0HTDM" target="_blank" rel="noopener">
      Full Playlist ↗
    </a>
  </header>

  <main class="card">

    <div class="perforation">
      <span></span><span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span><span></span>
    </div>

    <h1 class="brand">Medical Store</h1>
    <p class="tagline">non-stop playlist &middot; no ads</p>

    <div class="stamp">Rx &middot; now playing</div>

    <div class="art-wrap">
      <img id="albumArt" src="" alt="Now playing artwork" />
    </div>

    <p class="song-title" id="songTitle">Loading playlist…</p>
    <p class="song-artist" id="songArtist">Medical Store Radio</p>

    <div class="progress-row">
      <span id="timeCurrent">0:00</span>
      <div class="progress-track" id="progressTrack">
        <div class="progress-fill" id="progressFill"></div>
        <div class="progress-dot" id="progressDot"></div>
      </div>
      <span id="timeTotal">0:00</span>
    </div>

    <div class="controls">
      <button class="btn-icon" id="prevBtn" aria-label="Previous song">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
      </button>

      <button class="btn-play" id="playBtn" aria-label="Play or pause">
        <!-- icon is swapped between play/pause by JS -->
        <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>

      <button class="btn-icon" id="nextBtn" aria-label="Next song">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 6l8.5 6L6 18z"/></svg>
      </button>
    </div>

    <p class="status-line" id="statusLine">connecting…</p>
  </main>

  <!-- Hidden YouTube player: only audio is used, no video chrome/ads shown -->
  <div id="ytPlayer" style="position:absolute; width:1px; height:1px; overflow:hidden; opacity:0;"></div>

<script>
  /* ================= 6. JS - CONFIG =================
     Change these two values to point the page at a different
     playlist or brand name. Everything else adapts automatically. */
  const CONFIG = {
    PLAYLIST_ID: 'PLq-bT4s33RYADNkcClDkLPovaKJx0HTDM', // your YouTube playlist
    BRAND_NAME: 'Medical Store'
  };

  /* ================= 7. JS - YOUTUBE PLAYER SETUP ================= */

  // Load the YouTube IFrame API script asynchronously.
  const ytScript = document.createElement('script');
  ytScript.src = 'https://www.youtube.com/iframe_api';
  document.body.appendChild(ytScript);

  let player;               // the YT.Player instance
  let isPlaying = false;
  let progressTimer = null; // interval used to update the progress bar

  // Called automatically by the YouTube API once it has loaded.
  window.onYouTubeIframeAPIReady = function () {
    player = new YT.Player('ytPlayer', {
      height: '1',
      width: '1',
      playerVars: {
        listType: 'playlist',
        list: CONFIG.PLAYLIST_ID,
        autoplay: 1,
        controls: 0,     // hide YouTube's own UI, we use our own controls
        disablekb: 1,
        modestbranding: 1,
        rel: 0
      },
      events: {
        onReady: onPlayerReady,
        onStateChange: onPlayerStateChange
      }
    });
  };

  function onPlayerReady() {
    document.getElementById('statusLine').textContent = 'tap play if audio does not start';
    // Some browsers block autoplay with sound until the user interacts once.
    player.playVideo();
  }

  function onPlayerStateChange(event) {
    if (event.data === YT.PlayerState.PLAYING) {
      isPlaying = true;
      setPlayIcon(true);
      updateNowPlayingInfo();
      startProgressTimer();
      document.getElementById('statusLine').textContent = 'now playing';
    } else if (event.data === YT.PlayerState.PAUSED) {
      isPlaying = false;
      setPlayIcon(false);
      stopProgressTimer();
    } else if (event.data === YT.PlayerState.ENDED) {
      // playlist auto-advances on its own; this is just a safety net
      stopProgressTimer();
    } else if (event.data === YT.PlayerState.CUED) {
      updateNowPlayingInfo();
    }
  }

  /* ================= 8. JS - UI LOGIC ================= */

  function setPlayIcon(playing) {
    const icon = document.getElementById('playIcon');
    icon.innerHTML = playing
      ? '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>'   // pause icon
      : '<path d="M8 5v14l11-7z"/>';                // play icon
  }

  function updateNowPlayingInfo() {
    if (!player || typeof player.getVideoData !== 'function') return;
    const data = player.getVideoData();
    if (!data) return;

    document.getElementById('songTitle').textContent = data.title || 'Medical Store Radio';
    document.getElementById('songArtist').textContent = data.author || CONFIG.BRAND_NAME;

    if (data.video_id) {
      // hqdefault thumbnail = reliable size that exists for every YouTube video
      document.getElementById('albumArt').src =
        `https://img.youtube.com/vi/${data.video_id}/hqdefault.jpg`;
    }
  }

  function formatTime(seconds) {
    if (!isFinite(seconds) || seconds < 0) seconds = 0;
    const m = Math.floor(seconds / 60);
    const s = Math.floor(seconds % 60).toString().padStart(2, '0');
    return `${m}:${s}`;
  }

  function startProgressTimer() {
    stopProgressTimer();
    progressTimer = setInterval(() => {
      if (!player || typeof player.getCurrentTime !== 'function') return;
      const current = player.getCurrentTime();
      const duration = player.getDuration();
      const pct = duration ? (current / duration) * 100 : 0;

      document.getElementById('progressFill').style.width = pct + '%';
      document.getElementById('progressDot').style.left = pct + '%';
      document.getElementById('timeCurrent').textContent = formatTime(current);
      document.getElementById('timeTotal').textContent = formatTime(duration);
    }, 500);
  }

  function stopProgressTimer() {
    if (progressTimer) clearInterval(progressTimer);
    progressTimer = null;
  }

  // ---- transport button handlers ----
  document.getElementById('playBtn').addEventListener('click', () => {
    if (!player) return;
    isPlaying ? player.pauseVideo() : player.playVideo();
  });

  document.getElementById('nextBtn').addEventListener('click', () => {
    if (player) player.nextVideo();
  });

  document.getElementById('prevBtn').addEventListener('click', () => {
    if (player) player.previousVideo();
  });

  // click-to-seek on the progress bar
  document.getElementById('progressTrack').addEventListener('click', (e) => {
    if (!player || typeof player.getDuration !== 'function') return;
    const rect = e.currentTarget.getBoundingClientRect();
    const ratio = (e.clientX - rect.left) / rect.width;
    const duration = player.getDuration();
    player.seekTo(duration * ratio, true);
  });

  // ---- fake "online now" counter ----
  // Purely cosmetic (matches the reference site's vibe). Wander gently
  // around a base number every few seconds. Replace with a real
  // websocket/analytics feed if you want a genuine live count.
  (function fakeOnlineCounter() {
    const el = document.getElementById('onlineCount');
    let count = 128;
    setInterval(() => {
      count += Math.floor(Math.random() * 5) - 2; // drift by -2..+2
      count = Math.max(40, Math.min(400, count));
      el.textContent = count;
    }, 4000);
  })();
</script>
</body>
</html>
